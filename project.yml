name: Feedless
options:
  bundleIdPrefix: com.mironable
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 85U7WJH8QN
    CODE_SIGN_STYLE: Automatic
targets:
  Feedless:
    type: application
    platform: iOS
    sources:
      - path: Feedless
        excludes:
          - "Resources/Rules/**"
      - path: Feedless/Resources/Rules
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mironable.feedless
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    info:
      path: Feedless/Info.plist
      properties:
        CFBundleDisplayName: Feedless
        LSApplicationQueriesSchemes: [instagram]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
  FeedlessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FeedlessTests
        excludes:
          - "Fixtures/**"
      - path: FeedlessTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Feedless
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mironable.feedless.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Feedless:
    build:
      targets:
        Feedless: all
        FeedlessTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FeedlessTests
